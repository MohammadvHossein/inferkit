[project]
name = "inferkit"
version = "0.1.6"
description = "Dynamic AI inference kit - deploy any ML/Vision/LLM function with one command"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["fastapi", "ai", "inference", "ml", "llm", "vision"]
classifiers = [
  "Framework :: FastAPI",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic-settings>=2.1",
  "python-multipart>=0.0.9",
  "slowapi>=0.1.9",
  "Pillow>=10",
]

[project.optional-dependencies]
torch = ["torch>=2.0", "torchvision>=0.15"]
transformers = ["transformers>=4.40", "accelerate>=0.27"]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.9", "anyio>=4", "pytest-cov>=5", "mypy>=1.11"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://github.com/MohammadvHossein/inferkit"
Repository = "https://github.com/MohammadvHossein/inferkit"

[project.scripts]
inferkit = "inferkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = ["BLE001", "S110", "B008", "TRY401", "RUF015", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=inferkit --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["inferkit"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.mkdocs]
site_name = "InferKit"
