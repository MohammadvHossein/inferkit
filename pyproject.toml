[project]
name = "inferkit"
version = "0.1.1"
description = "Dynamic AI inference kit - deploy any ML/Vision/LLM function with one command"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic-settings>=2.1",
  "python-multipart>=0.0.9",
  "slowapi>=0.1.9",
  "Pillow>=10",
]
[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[project.scripts]
inferkit = "inferkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
